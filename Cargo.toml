[package]
name = "finch"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
arboard = "3"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
des = "0.9.0"
ecb = { version = "0.2.1", features = ["alloc"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "clipboard", "links"] }
egui = "0.37.0"
egui_dnd = "0.18"
egui_extras = "0.37.0"
egui_system_font_provider = "0.37.0"
flate2 = "1.1.10"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "native-tokio"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "tokio"] }
md-5 = "0.11.0"
rc4 = "0.2.0"
regex = "1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
similar = "3.2.1"
slinger = { git = "https://github.com/emo-crab/slinger", features = ["tls", "rustls", "gzip", "http2"] }
# Embedded mitm engine (src/mitm) dependencies:
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls-pki-types = "1.1.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
moka = { version = "0.12", features = ["future"] }
thiserror = "2"
time = "0.3"
uuid = { version = "1.18", features = ["v4"] }
rand = "0.10"
sm4 = "0.6.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
sm3 = "0.5.0"

# eframe is built with default-features = false, which leaves winit without
# any Linux windowing backend (it then fails to compile). Enable X11 there;
# it is pure-Rust at build time (x11rb) and dlopens libX11 at runtime, so no
# system dev packages are needed in CI. Wayland users go through XWayland.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", features = ["x11"] }

# --- TUN capture mode (Windows / wintun) -----------------------------------
[target.'cfg(target_os = "windows")'.dependencies]
# TUN device (wintun-backed), userspace TCP/IP stack, route management.
tun = { version = "0.8", features = ["async"] }
ipstack = "1.0"
route_manager = "0.2"
# Per-process attribution: TCP/UDP connection tables with owning PIDs.
netstat2 = "0.11"
# Bind direct-dial sockets to the physical interface while TUN routes are up.
socket2 = "0.6"
# wintun.dll is fetched as a zip from wintun.net on first enable.
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tracing-subscriber = "0.3.23"
